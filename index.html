<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Duka</title>
<style>
:root{--bg:#e8edf2;--pp:#fff;--ink:#14213d;--mu:#6b7686;--ln:#d3dae3;--ac:#14213d;--red:#d62828;--yl:#fcbf49;--ok:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--pp:#18233a;--ink:#eef2f7;--mu:#93a0b4;--ln:#2a3753;--ac:#fcbf49;--red:#ff6b6b;--ok:#4fd195}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
header h1{font-size:20px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
#chip{font-size:12px;color:var(--mu)}
.ib{background:none;border:0;color:var(--ink);padding:6px;width:auto;font-size:20px}
main{max-width:600px;margin:0 auto;padding:6px 14px}
input{font:inherit;color:var(--ink);background:var(--pp);border:1.5px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{font:inherit;cursor:pointer}
.mu{color:var(--mu);font-size:13px}.low{color:var(--red)}
label{display:block;font-size:13px;color:var(--mu)}label input{margin-top:4px;color:var(--ink)}
.r{display:flex;gap:10px;align-items:flex-end}.r>*{flex:1}
.tape{background:var(--pp);padding:16px 18px 26px;margin:6px 0 14px;-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 9px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 9px repeat-x}
.tape .t{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.tape .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);border-top:1px dashed var(--ln);margin-top:10px;padding-top:8px}
.card{background:var(--pp);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tile{background:var(--pp);border:0;border-left:5px solid var(--yl);border-radius:12px;padding:12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:84px}
.tile:active{transform:scale(.97)}.tile b{font-size:15px}.tile span{font-weight:700}.tile em{font-style:normal;font-size:12px;color:var(--mu)}
.bl{display:grid;grid-template-columns:1fr auto 84px 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.stp{display:flex;align-items:center;gap:8px}.stp button,.seg button{background:var(--bg);border:0;border-radius:8px;width:32px;height:32px;color:var(--ink);font-size:18px}
.pr{padding:8px;text-align:right}.x{background:none;border:0;color:var(--mu);font-size:16px;padding:4px;width:auto}
.seg{display:flex;gap:8px;margin:12px 0}.seg button{flex:1;width:auto;height:42px;font-size:15px;font-weight:600}.seg .on{background:var(--ac);color:var(--pp)}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin-bottom:8px}
.pri{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;margin-top:10px}
.ghost{width:100%;background:none;border:1.5px solid var(--ln);color:var(--ink);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.rt{text-align:right;white-space:nowrap}
.dn{display:flex;gap:8px;margin-bottom:8px}.dn button{width:46px;background:var(--pp);border:0;border-radius:10px;color:var(--ink);font-size:20px}
#dx{margin-top:10px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad button{border:0;border-radius:12px;background:var(--bg);color:var(--ink);font-size:22px;padding:16px 0}.pad .op{background:var(--ac);color:var(--pp)}
#cd{font-size:38px;font-weight:700;text-align:right;word-break:break-all}#ce{text-align:right;color:var(--mu);min-height:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pp);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 0 var(--ln)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ink);font-weight:700}nav button.on svg{stroke:var(--red)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.den{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.den button{background:var(--bg);border:0;border-left:5px solid var(--red);border-radius:10px;padding:10px;text-align:left;color:var(--ink);display:flex;flex-direction:column}
.er{border-top:1px solid var(--ln);padding:10px 0}.er .r{margin-top:6px}.sm{background:none;border:1.5px solid var(--ln);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px}.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tape .l{flex-wrap:wrap;gap:4px 12px}.ok{color:var(--ok)}.tb{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.tb th,.tb td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left;white-space:normal}.tb th{color:var(--mu);font-weight:600}
</style></head><body>
<header><h1>Duka</h1><span id="chip"></span><button class="ib" data-t="set" aria-label="Sync and backup">⚙</button></header>
<main id="v"></main>
<nav id="nv">
<button data-t="sell"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h10l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/></svg>Sell</button>
<button data-t="day"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Ledger</button>
<button data-t="stock"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>Stock</button>
<button data-t="calc"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg>Calc</button>
<button data-t="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
</nav>
<script>
const K='duka2',$=s=>document.querySelector(s),money=n=>'KES '+(Math.round(n*100)/100).toLocaleString('en-KE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),rd3=x=>Math.round(x*1000)/1000;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date()),hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let S={items:[],sales:[],floats:{},out:[],cr:[],notes:[],tok:'',gid:'',at:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
function mig(){S.items.forEach(i=>{if(!i.den){i.den=[{id:'d1',label:'1 pc',amt:1,price:i.price||0,cost:0}];i.unit=i.unit||'pcs'}})}mig();
let tab='sell',day=today(),bk=[],pay='Cash',q='',timer,busy=false,msg='',pick=null,ed=null,sub='',per='all',expPay='Cash',openC=null;
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Phone storage is full or blocked – export a backup now.')}};
function changed(){persist();render();clearTimeout(timer);timer=setTimeout(sync,1500)}
const amtOf=s=>s.amt!=null?s.amt:s.qty;
function stock(){const m={},im={};S.items.forEach(i=>{m[i.id]=i.base;im[i.id]=i});S.sales.forEach(s=>{const i=im[s.item];if(!s.v&&i&&s.t>i.bt)m[i.id]-=amtOf(s)});for(const k in m)m[k]=rd3(m[k]);return m}
function sums(d){let c=0,m=0,k=0,n=0,p=0;S.sales.forEach(s=>{if(s.d===d&&!s.v){const v=s.qty*s.price;n++;s.pay==='M-Pesa'?m+=v:s.pay==='Credit'?k+=v:c+=v;if(s.cost!=null)p+=v-s.qty*s.cost}});return{c,m,k,n,p,t:c+m+k}}
function tape(d,title){const t=sums(d);return`<div class="tape"><div class="mu">${title}</div><div class="t">${money(t.t)}</div><div class="l"><span>Cash ${money(t.c)}</span><span>M-Pesa ${money(t.m)}</span>${t.k?`<span>Credit ${money(t.k)}</span>`:''}<span>${t.n} sales</span><span><b>Profit ${money(t.p)}</b></span></div></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({sell:vSell,day:vDay,stock:vStock,calc:vCalc,more:vMore})[tab]();stat()}
function stat(){$('#chip').textContent=busy?'Syncing…':msg||(!S.tok?'Saved on phone':!navigator.onLine?'Offline · saved':S.at?'Synced '+hm(S.at):'Not synced yet')}
/* SELL */
function vSell(){$('#v').innerHTML=tape(today(),'Today')+'<div id="bk"></div><div id="pk"></div><input id="q" placeholder="Search items" value="'+esc(q)+'"><div id="gr" class="grid"></div>';
 $('#q').oninput=e=>{q=e.target.value;grid()};basket();picker();grid()}
function grid(){const st=stock(),l=S.items.filter(i=>!i.x&&i.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
 $('#gr').innerHTML=l.length?l.map(i=>`<button class="tile" data-add="${i.id}"><b>${esc(i.name)}</b><span>${i.den.length>1?i.den.length+' sizes':money(i.den[0].price)}</span><em class="${st[i.id]<=3?'low':''}">${st[i.id]} ${esc(i.unit)} left</em></button>`).join(''):'<p class="mu">No items yet. Add them in the Stock tab.</p>'}
function picker(){const el=$('#pk'),i=S.items.find(x=>x.id===pick);if(!el)return;if(!i){el.innerHTML='';return}
 el.innerHTML=`<div class="card"><div class="r" style="align-items:center"><b>${esc(i.name)}</b><button class="x" style="flex:0" data-pc>✕</button></div><div class="den">${i.den.map(d=>`<button data-dn="${i.id}|${d.id}"><b>${esc(d.label)}</b><span>${money(d.price)}</span></button>`).join('')}</div>
<div class="r"><label>Custom amount (${esc(i.unit)})<input id="ca" type="number" inputmode="decimal"></label><label>Price KES<input id="cp" type="number" inputmode="decimal"></label><button class="sm" style="flex:0" data-cu="${i.id}">Add</button></div></div>`}
function addLine(i,d,custom){const key=custom?'c'+uid():i.id+'|'+d.id,b=bk.find(x=>x.key===key);
 if(b)b.qty++;else bk.push({key,item:i.id,name:i.name,label:d.label,amt:d.amt,qty:1,price:d.price,cost:d.cost==null?null:d.cost});pick=null;basket();picker()}
function basket(){const el=$('#bk');if(!el)return;if(!bk.length){el.innerHTML='';return}
 el.innerHTML=`<div class="card">${bk.map((b,i)=>`<div class="bl"><div><b>${esc(b.name)}</b><div class="mu">${esc(b.label)}</div></div><div class="stp"><button data-m="${i}">−</button><b>${b.qty}</b><button data-p="${i}">+</button></div><input class="pr" type="number" inputmode="decimal" value="${b.price}" data-pr="${i}"><button class="x" data-r="${i}">✕</button></div>`).join('')}
<div class="seg"><button data-py="Cash" class="${pay==='Cash'?'on':''}">Cash</button><button data-py="M-Pesa" class="${pay==='M-Pesa'?'on':''}">M-Pesa</button><button data-py="Credit" class="${pay==='Credit'?'on':''}">Credit</button></div>
<div class="tot"><span>Total</span><span id="bt"></span></div>${pay==='Credit'?`<input id="cn" list="cl" placeholder="Customer name" autocomplete="off"><datalist id="cl">${credBal().map(c=>`<option value="${esc(c.who)}">`).join('')}</datalist>`:`<div class="r"><input id="td" type="number" inputmode="decimal" placeholder="Cash given (optional)"><div id="ch" class="mu"></div></div>`}
<button class="pri" data-ch>Record sale</button></div>`;bt()}
function bt(){const t=bk.reduce((a,b)=>a+b.qty*b.price,0),g=+($('#td')||{}).value;$('#bt').textContent=money(t);if($('#ch'))$('#ch').textContent=g&&pay==='Cash'?(g>=t?'Change '+money(g-t):'Short '+money(t-g)):''}
/* LEDGER */
const sline=s=>`${esc(s.name)}${s.lab?' · '+esc(s.lab):''}`;
function vDay(){const l=S.sales.filter(s=>s.d===day&&!s.v).sort((a,b)=>b.t-a.t),f=(S.floats[day]||{}).v||0;
 $('#v').innerHTML=`<div class="dn"><button data-dd="-1">‹</button><input type="date" id="dp" value="${day}"><button data-dd="1">›</button></div>${tape(day,day===today()?'Today':'Sales on')}
<div class="card"><div class="r"><label>Opening float<input id="fl" type="number" inputmode="decimal" value="${f||''}"></label><label>Cash counted<input id="cc" type="number" inputmode="decimal"></label></div><div id="dx2"></div></div>
<div class="card">${l.map(s=>`<div class="row"><div><b>${sline(s)}</b><div class="mu">${s.qty} × ${money(s.price)} · ${s.pay} · ${hm(s.t)}</div></div><div class="rt"><b>${money(s.qty*s.price)}</b> <button class="x" data-v="${s.id}" aria-label="Remove sale">✕</button></div></div>`).join('')||'<p class="mu">No sales on this day.</p>'}</div>${outCard()}<button class="ghost" data-csv>Export this day (CSV)</button>`;
 $('#dp').onchange=e=>{day=e.target.value||today();render()};
 $('#fl').oninput=e=>{S.floats[day]={v:+e.target.value||0,u:Date.now()};persist();clearTimeout(timer);timer=setTimeout(sync,1500);cnt()};$('#cc').oninput=cnt;cnt()}
function drawer(d){const t=sums(d);let ex=0,sb=0,cr=0;S.out.forEach(o=>{if(o.d===d&&!o.v&&o.pay==='Cash')o.k==='stk'?sb+=o.amt:ex+=o.amt});S.cr.forEach(c=>{if(c.d===d&&!c.v&&c.kind==='pay'&&c.pay==='Cash')cr+=c.amt});const f=(S.floats[d]||{}).v||0;return{f,cash:t.c,cr,ex,sb,exp:f+t.c+cr-ex-sb}}
function cnt(){const w=drawer(day),f=+$('#fl').value||0,exp=w.exp-w.f+f,g=$('#cc').value,d=+g-exp;
 $('#dx2').innerHTML='<p style="font-weight:600;margin:10px 0 0">Cash expected in drawer: '+money(exp)+'</p><p class="mu" style="margin:2px 0 0">Float '+money(f)+' + cash sales '+money(w.cash)+(w.cr?' + credit repaid '+money(w.cr):'')+(w.ex?' − expenses '+money(w.ex):'')+(w.sb?' − stock bought '+money(w.sb):'')+'</p>'+(g!==''?'<p class="'+(d<0?'low':'')+'" style="font-weight:600;margin:6px 0 0">'+(d===0?'Balanced ✓':(d<0?'Short ':'Over ')+money(Math.abs(d)))+'</p>':'')}
function outCard(){const l=S.out.filter(o=>o.d===day&&!o.v);return`<div class="card"><b>Money out</b>${l.map(o=>`<div class="row"><div>${esc(o.what)}<div class="mu">${o.k==='stk'?'Stock bought':'Expense'} · ${o.pay}</div></div><div class="rt"><b>${money(o.amt)}</b> <button class="x" data-ov="${o.id}">✕</button></div></div>`).join('')||'<p class="mu">Nothing today. Expenses and stock bought show here.</p>'}</div>`}
/* STOCK */
const blankDen=()=>({id:uid(),label:'',amt:1,price:0,cost:0});
function vStock(){if(ed)return vEdit();const st=stock(),l=S.items.filter(i=>!i.x).sort((a,b)=>a.name.localeCompare(b.name));
 $('#v').innerHTML=`<div class="r" style="margin-bottom:12px"><button class="pri" style="margin:0;background:var(--ac);color:var(--pp)" data-nw>+ New item</button><button class="ghost" style="margin:0" data-pl>Print price list</button></div>
<div class="card">${l.map(i=>`<div class="row" style="display:block"><b>${esc(i.name)}</b> <span class="mu">· <span class="${st[i.id]<=3?'low':''}">${st[i.id]} ${esc(i.unit)} in stock</span></span><div class="mu">${i.den.map(d=>esc(d.label)+' '+d.price+(d.cost?' (cost '+d.cost+')':'')).join(' · ')}</div><div class="acts"><button class="sm" data-stk="${i.id}">Add stock</button><button class="sm" data-set="${i.id}">Set count</button><button class="sm" data-ed="${i.id}">Edit</button><button class="sm" data-rm="${i.id}">Remove</button></div></div>`).join('')||'<p class="mu">No items yet. Tap “New item”.</p>'}</div>`}
function vEdit(){$('#v').innerHTML=`<div class="card"><b>${ed.id?'Edit item':'New item'}</b>
<div class="r" style="margin-top:8px"><label>Item name<input data-ef="name" value="${esc(ed.name)}" placeholder="e.g. Cooking oil"></label></div>
<div class="r"><label>Stock unit<input data-ef="unit" value="${esc(ed.unit)}" placeholder="L, kg, pcs"></label>${ed.id?'':`<label>Starting stock<input data-ef="start" type="number" inputmode="decimal" value="${ed.start}"></label>`}</div>
<p class="mu" style="margin:12px 0 0"><b>Sizes you sell</b> — for each, type how much stock it uses, your selling price and your buying price.</p>
${ed.den.map((d,i)=>`<div class="er"><input data-di="${i}" data-df="label" value="${esc(d.label)}" placeholder="Size name e.g. 250 ml"><div class="r"><label>Uses (${esc(ed.unit||'unit')})<input data-di="${i}" data-df="amt" type="number" inputmode="decimal" value="${d.amt}"></label><label>Sell KES<input data-di="${i}" data-df="price" type="number" inputmode="decimal" value="${d.price}"></label><label>Buy KES<input data-di="${i}" data-df="cost" type="number" inputmode="decimal" value="${d.cost}"></label></div><div class="acts"><button class="sm" data-dup="${i}">Duplicate</button>${ed.den.length>1?`<button class="sm" data-dx="${i}">Remove size</button>`:''}</div></div>`).join('')}
<button class="ghost" style="margin-top:8px" data-ad>+ Add another size</button><button class="pri" data-isave>Save item</button><button class="ghost" style="margin-top:8px" data-icancel>Cancel</button></div>`}
/* CALC */
let acc=null,op=null,typed=false,cd='0',ce='';
function vCalc(){const k=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','00','='];
 $('#v').innerHTML=`<div class="card"><div id="ce">${ce}</div><div id="cd">${cd}</div><div class="pad" style="margin-top:10px">${k.map(x=>`<button class="${'÷×−+='.includes(x)?'op':''}" data-k="${x}">${x}</button>`).join('')}</div></div>`}
function calc(k){const n=()=>parseFloat(cd)||0,r=x=>String(Math.round(x*1e8)/1e8),ap=(a,o,b)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:(b===0?0:a/b);
 if(k==='C'){acc=null;op=null;typed=false;cd='0';ce=''}
 else if(k==='⌫'){if(typed)cd=cd.length>1?cd.slice(0,-1):'0'}
 else if(k==='='){if(op&&acc!==null){cd=r(ap(acc,op,n()));acc=null;op=null;ce='';typed=false}}
 else if('÷×−+'.includes(k)){if(acc===null)acc=n();else if(typed)acc=ap(acc,op,n());op=k;typed=false;cd=r(acc);ce=cd+' '+k}
 else if(k==='%'){cd=r(acc!==null&&(op==='+'||op==='−')?acc*n()/100:n()/100);typed=true}
 else if(k==='.'){if(!typed){cd='0.';typed=true}else if(!cd.includes('.'))cd+='.'}
 else{if(!typed){cd=k==='00'?'0':k;typed=true}else cd=cd==='0'?(k==='00'?'0':k):cd+k}
 $('#ce').textContent=ce;$('#cd').textContent=cd}
/* MORE */
function credBal(){const m={};S.cr.forEach(c=>{if(c.v)return;const k=c.who.trim().toLowerCase(),r=m[k]=m[k]||{key:k,who:c.who.trim(),bal:0,l:[]};r.bal+=c.kind==='owe'?c.amt:-c.amt;r.l.push(c)});return Object.values(m).sort((a,b)=>b.bal-a.bal)}

 else if(d.cv){if(confirm('Remove this credit entry?')){S.cr.find(c=>c.id===d.cv).v=1;changed()}}
 else if(d.nadd!==undefined){const x=$('#nt').value.trim();if(!x)return;S.notes.push({id:uid(),txt:x,n:1,done:0,u:Date.now()});changed()}
 else if(d.nplus){const n=S.notes.find(x=>x.id===d.nplus);n.n++;n.u=Date.now();changed()}
 else if(d.ndone){const n=S.notes.find(x=>x.id===d.ndone);n.done=n.done?0:1;n.u=Date.now();changed()}
 else if(d.nrm){const n=S.notes.find(x=>x.id===d.nrm);if(confirm('Delete this request?')){n.x=1;n.u=Date.now();changed()}}
 else if(d.k)calc(d.k);
 else if(d.tk!==undefined){S.tok=$('#tk').value.trim();persist();sync()}
 else if(d.ex!==undefined)dl(JSON.stringify({items:S.items,sales:S.sales,floats:S.floats,out:S.out,cr:S.cr,notes:S.notes}),'duka-backup-'+today()+'.json','application/json')});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.pr!==undefined){bk[d.pr].price=+t.value;bt()}else if(t.id==='td')bt();
 else if(d.ef)ed[d.ef]=t.value;else if(d.di!==undefined)ed.den[d.di][d.df]=t.type==='number'?t.value:t.value});
/* SYNC */
function mergeIn(d){const im=new Map(S.items.map(i=>[i.id,i]));(d.items||[]).forEach(i=>{const o=im.get(i.id);if(!o||(i.u||0)>(o.u||0))im.set(i.id,i)});S.items=[...im.values()];mig();
 const sm=new Map(S.sales.map(s=>[s.id,s]));(d.sales||[]).forEach(s=>{const o=sm.get(s.id);if(!o)sm.set(s.id,s);else if(s.v)o.v=1});S.sales=[...sm.values()];
 Object.entries(d.floats||{}).forEach(([k,f])=>{if(!S.floats[k]||(f.u||0)>(S.floats[k].u||0))S.floats[k]=f});un('out',d.out);un('cr',d.cr);const nm=new Map(S.notes.map(x=>[x.id,x]));(d.notes||[]).forEach(x=>{const o=nm.get(x.id);if(!o||(x.u||0)>(o.u||0))nm.set(x.id,x)});S.notes=[...nm.values()]}
function un(k,r){const m=new Map(S[k].map(x=>[x.id,x]));(r||[]).forEach(x=>{const o=m.get(x.id);if(!o)m.set(x.id,x);else if(x.v)o.v=1});S[k]=[...m.values()]}
function build(){const o={'core.json':JSON.stringify({items:[...S.items].sort((a,b)=>a.id<b.id?-1:1),floats:S.floats,notes:[...S.notes].sort((a,b)=>a.id<b.id?-1:1)})},m={};
 const add=(k,a)=>[...a].sort((x,y)=>x.t-y.t||(x.id<y.id?-1:1)).forEach(e=>{const mo=e.d.slice(0,7);(m[mo]=m[mo]||{sales:[],out:[],cr:[]})[k].push(e)});add('sales',S.sales);add('out',S.out);add('cr',S.cr);
 for(const k in m)o['s-'+k+'.json']=JSON.stringify(m[k]);return o}
async function gh(p,o={}){const r=await fetch('https://api.github.com'+p,{...o,headers:{Authorization:'Bearer '+S.tok,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw new Error(r.status===401?'bad token':r.status);return r.json()}
async function sync(){if(busy||!S.tok||!navigator.onLine){stat();return}busy=true;msg='';stat();
 try{if(!S.gid){const l=await gh('/gists?per_page=100');const f=l.find(g=>g.description==='DUKA-LEDGER');if(f)S.gid=f.id}
  const rf={};if(S.gid){const g=await gh('/gists/'+S.gid);for(const[n,f]of Object.entries(g.files)){let c=f.content;if(f.truncated)c=await(await fetch(f.raw_url)).text();rf[n]=c;try{mergeIn(JSON.parse(c))}catch(x){}}}
  const out=build(),ch={};for(const n in out)if(out[n]!==rf[n])ch[n]={content:out[n]};
  if(!S.gid){S.gid=(await gh('/gists',{method:'POST',body:JSON.stringify({description:'DUKA-LEDGER',public:false,files:ch})})).id}
  else if(Object.keys(ch).length)await gh('/gists/'+S.gid,{method:'PATCH',body:JSON.stringify({files:ch})});
  S.at=Date.now();persist()}catch(e){msg='Sync failed: '+e.message}
 busy=false;const a=document.activeElement;if(!a||a.tagName!=='INPUT')render();else stat()}
addEventListener('online',sync);addEventListener('offline',stat);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();sync();
</script></body></html>
