<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Duka</title>
<style>
:root{--bg:#e8edf2;--pp:#fff;--ink:#14213d;--mu:#6b7686;--ln:#d3dae3;--ac:#14213d;--red:#d62828;--yl:#fcbf49;--ok:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--pp:#18233a;--ink:#eef2f7;--mu:#93a0b4;--ln:#2a3753;--ac:#fcbf49;--red:#ff6b6b;--ok:#4fd195}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
header h1{font-size:20px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
#chip{font-size:12px;color:var(--mu)}
.ib{background:none;border:0;color:var(--ink);padding:6px;width:auto;font-size:20px}
main{max-width:600px;margin:0 auto;padding:6px 14px}
input{font:inherit;color:var(--ink);background:var(--pp);border:1.5px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{font:inherit;cursor:pointer}
.mu{color:var(--mu);font-size:13px}.low{color:var(--red)}
label{display:block;font-size:13px;color:var(--mu)}label input{margin-top:4px;color:var(--ink)}
.r{display:flex;gap:10px;align-items:flex-end}.r>*{flex:1}
.tape{background:var(--pp);padding:16px 18px 26px;margin:6px 0 14px;-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 9px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 9px repeat-x}
.tape .t{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.tape .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);border-top:1px dashed var(--ln);margin-top:10px;padding-top:8px}
.card{background:var(--pp);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tile{background:var(--pp);border:0;border-left:5px solid var(--yl);border-radius:12px;padding:12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:84px}
.tile:active{transform:scale(.97)}.tile b{font-size:15px}.tile span{font-weight:700}.tile em{font-style:normal;font-size:12px;color:var(--mu)}
.bl{display:grid;grid-template-columns:1fr auto 84px 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.stp{display:flex;align-items:center;gap:8px}.stp button,.seg button{background:var(--bg);border:0;border-radius:8px;width:32px;height:32px;color:var(--ink);font-size:18px}
.pr{padding:8px;text-align:right}.x{background:none;border:0;color:var(--mu);font-size:16px;padding:4px;width:auto}
.seg{display:flex;gap:8px;margin:12px 0}.seg button{flex:1;width:auto;height:42px;font-size:15px;font-weight:600}.seg .on{background:var(--ac);color:var(--pp)}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin-bottom:8px}
.pri{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;margin-top:10px}
.ghost{width:100%;background:none;border:1.5px solid var(--ln);color:var(--ink);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.rt{text-align:right;white-space:nowrap}
.dn{display:flex;gap:8px;margin-bottom:8px}.dn button{width:46px;background:var(--pp);border:0;border-radius:10px;color:var(--ink);font-size:20px}
#dx{margin-top:10px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad button{border:0;border-radius:12px;background:var(--bg);color:var(--ink);font-size:22px;padding:16px 0}.pad .op{background:var(--ac);color:var(--pp)}
#cd{font-size:38px;font-weight:700;text-align:right;word-break:break-all}#ce{text-align:right;color:var(--mu);min-height:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pp);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 0 var(--ln)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ink);font-weight:700}nav button.on svg{stroke:var(--red)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>Duka</h1><span id="chip"></span><button class="ib" data-t="set" aria-label="Sync and backup">⚙</button></header>
<main id="v"></main>
<nav id="nv">
<button data-t="sell"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h10l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/></svg>Sell</button>
<button data-t="day"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Ledger</button>
<button data-t="stock"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>Stock</button>
<button data-t="calc"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg>Calc</button>
</nav>
<script>
const K='duka2',$=s=>document.querySelector(s),money=n=>'KES '+(Math.round(n*100)/100).toLocaleString('en-KE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date()),hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let S={items:[],sales:[],floats:{},tok:'',gid:'',at:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
let tab='sell',day=today(),bk=[],pay='Cash',q='',timer,busy=false,msg='',cd='0',ce='';
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Phone storage is full or blocked – export a backup now.')}};
function changed(){persist();render();clearTimeout(timer);timer=setTimeout(sync,1500)}
function stock(){const m={},im={};S.items.forEach(i=>{m[i.id]=i.base;im[i.id]=i});S.sales.forEach(s=>{const i=im[s.item];if(!s.v&&i&&s.t>i.bt)m[i.id]-=s.qty});return m}
function sums(d){let c=0,m=0,n=0;S.sales.forEach(s=>{if(s.d===d&&!s.v){n++;s.pay==='M-Pesa'?m+=s.qty*s.price:c+=s.qty*s.price}});return{c,m,n,t:c+m}}
function tape(d,title){const t=sums(d);return`<div class="tape"><div class="mu">${title}</div><div class="t">${money(t.t)}</div><div class="l"><span>Cash ${money(t.c)}</span><span>M-Pesa ${money(t.m)}</span><span>${t.n} sales</span></div></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({sell:vSell,day:vDay,stock:vStock,calc:vCalc,set:vSet})[tab]();stat()}
function stat(){$('#chip').textContent=busy?'Syncing…':msg||(!S.tok?'Saved on phone':!navigator.onLine?'Offline · saved':S.at?'Synced '+hm(S.at):'Not synced yet')}
/* SELL */
function vSell(){$('#v').innerHTML=tape(today(),'Today')+'<div id="bk"></div><input id="q" placeholder="Search items" value="'+esc(q)+'"><div id="gr" class="grid"></div>';
 $('#q').oninput=e=>{q=e.target.value;grid()};basket();grid()}
function grid(){const st=stock(),l=S.items.filter(i=>!i.x&&i.name.toLowerCase().includes(q.toLowerCase()));
 $('#gr').innerHTML=l.length?l.map(i=>`<button class="tile" data-add="${i.id}"><b>${esc(i.name)}</b><span>${money(i.price)}</span><em class="${st[i.id]<=3?'low':''}">${st[i.id]} left</em></button>`).join(''):'<p class="mu">No items yet. Add them in the Stock tab.</p>'}
function basket(){const el=$('#bk');if(!el)return;if(!bk.length){el.innerHTML='';return}
 el.innerHTML=`<div class="card">${bk.map((b,i)=>`<div class="bl"><b>${esc(b.name)}</b><div class="stp"><button data-m="${i}">−</button><b>${b.qty}</b><button data-p="${i}">+</button></div><input class="pr" type="number" inputmode="decimal" value="${b.price}" data-pr="${i}"><button class="x" data-r="${i}">✕</button></div>`).join('')}
<div class="seg"><button data-py="Cash" class="${pay==='Cash'?'on':''}">Cash</button><button data-py="M-Pesa" class="${pay==='M-Pesa'?'on':''}">M-Pesa</button></div>
<div class="tot"><span>Total</span><span id="bt"></span></div><div class="r"><input id="td" type="number" inputmode="decimal" placeholder="Cash given (optional)"><div id="ch" class="mu"></div></div>
<button class="pri" data-ch>Record sale</button></div>`;bt()}
function bt(){const t=bk.reduce((a,b)=>a+b.qty*b.price,0),g=+($('#td')||{}).value;$('#bt').textContent=money(t);$('#ch').textContent=g&&pay==='Cash'?(g>=t?'Change '+money(g-t):'Short '+money(t-g)):''}
/* LEDGER */
function vDay(){const l=S.sales.filter(s=>s.d===day&&!s.v).sort((a,b)=>b.t-a.t),f=(S.floats[day]||{}).v||0;
 $('#v').innerHTML=`<div class="dn"><button data-dd="-1">‹</button><input type="date" id="dp" value="${day}"><button data-dd="1">›</button></div>${tape(day,day===today()?'Today':'Sales on')}
<div class="card"><div class="r"><label>Opening float<input id="fl" type="number" inputmode="decimal" value="${f||''}"></label><label>Cash counted<input id="cc" type="number" inputmode="decimal"></label></div><div id="dx"></div></div>
<div class="card">${l.map(s=>`<div class="row"><div><b>${esc(s.name)}</b><div class="mu">${s.qty} × ${money(s.price)} · ${s.pay} · ${hm(s.t)}</div></div><div class="rt"><b>${money(s.qty*s.price)}</b> <button class="x" data-v="${s.id}" aria-label="Remove sale">✕</button></div></div>`).join('')||'<p class="mu">No sales on this day.</p>'}</div><button class="ghost" data-csv>Export this day (CSV)</button>`;
 $('#dp').onchange=e=>{day=e.target.value||today();render()};
 $('#fl').oninput=e=>{S.floats[day]={v:+e.target.value||0,u:Date.now()};persist();clearTimeout(timer);timer=setTimeout(sync,1500);cnt()};$('#cc').oninput=cnt;cnt()}
function cnt(){const exp=sums(day).c+(+$('#fl').value||0),g=$('#cc').value,d=+g-exp;
 $('#dx').innerHTML='Cash expected in drawer: '+money(exp)+(g!==''?'<br><span class="'+(d<0?'low':'')+'">'+(d===0?'Balanced ✓':(d<0?'Short ':'Over ')+money(Math.abs(d)))+'</span>':'')}
/* STOCK */
function vStock(){const st=stock(),l=S.items.filter(i=>!i.x).sort((a,b)=>a.name.localeCompare(b.name));
 $('#v').innerHTML=`<div class="card"><label>Item name<input id="an" placeholder="e.g. Sugar 1/2 kg"></label><div class="r" style="margin-top:8px"><label>Price<input id="ap" type="number" inputmode="decimal"></label><label>Quantity to add<input id="aq" type="number" inputmode="decimal"></label></div><p class="mu">Using an existing name updates its price and adds the quantity.</p><button class="pri" style="margin-top:0;background:var(--ac);color:var(--pp)" data-save>Save item</button></div>
<div class="card">${l.map(i=>`<div class="row"><div><b>${esc(i.name)}</b><div class="mu">${money(i.price)} · <span class="${st[i.id]<=3?'low':''}">${st[i.id]} in stock</span></div></div><div class="rt"><button class="x" data-ed="${i.id}">Edit</button><button class="x" data-rm="${i.id}">Remove</button></div></div>`).join('')||'<p class="mu">No items yet.</p>'}</div>`}
/* CALC */
function vCalc(){const k=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','00','='];
 $('#v').innerHTML=`<div class="card"><div id="ce">${ce}</div><div id="cd">${cd}</div><div class="pad" style="margin-top:10px">${k.map(x=>`<button class="${'÷×−+='.includes(x)?'op':''}" data-k="${x}">${x}</button>`).join('')}</div></div>`}
function ev(s){const t=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/(\d+\.?\d*)%/g,'($1/100)');if(!/^[0-9+\-*/.()\s]+$/.test(t))return NaN;try{return Function('"use strict";return('+t+')')()}catch(e){return NaN}}
function calc(k){if(k==='C'){ce='';cd='0'}else if(k==='⌫')cd=cd.length>1?cd.slice(0,-1):'0';
 else if(k==='='){const r=ev(ce+cd);if(isFinite(r)){ce='';cd=String(Math.round(r*1e8)/1e8)}}
 else if('÷×−+'.includes(k)){ce+=cd+k;cd='0'}else if(k==='%')cd+='%';
 else if(k==='.'){if(!cd.includes('.'))cd+='.'}else cd=cd==='0'?k.replace(/^0+/,'')||'0':cd+k;
 $('#ce').textContent=ce;$('#cd').textContent=cd}
/* SETTINGS */
function vSet(){$('#v').innerHTML=`<div class="card"><b>Sync across devices (GitHub Gist)</b><p class="mu">Your sales and stock are saved in a private Gist on your own GitHub account. Create a token at github.com/settings/tokens (classic, tick only “gist”), paste it here, and use the same token on any other device. The token stays on this device.</p>
<label>GitHub token<input id="tk" type="password" value="${esc(S.tok)}" placeholder="ghp_…" autocomplete="off"></label><button class="pri" style="background:var(--ac);color:var(--pp)" data-tk>Save and sync now</button><p class="mu" id="sm">${msg||(S.gid?'Linked to your Gist.':'Not linked yet.')}</p></div>
<div class="card"><b>Backup</b><p class="mu">A file copy of everything on this phone.</p><button class="ghost" data-ex>Download backup</button><label class="ghost" style="display:block;text-align:center;border-radius:12px">Restore backup<input type="file" id="rf" accept=".json" hidden></label></div>`;
 $('#rf').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.items)||!Array.isArray(d.sales))throw 0;mergeIn(d);changed();alert('Backup restored.')}catch(x){alert('That file is not a valid backup.')}}}
/* ACTIONS */
document.addEventListener('click',e=>{const t=e.target.closest('button,label');if(!t)return;const d=t.dataset;
 if(d.t){tab=d.t;if(tab==='day')day=today();render();return}
 if(d.add){const i=S.items.find(x=>x.id===d.add),b=bk.find(x=>x.id===i.id);b?b.qty++:bk.push({id:i.id,name:i.name,qty:1,price:i.price});basket()}
 else if(d.m!==undefined){const b=bk[d.m];b.qty--;if(b.qty<1)bk.splice(d.m,1);basket()}
 else if(d.p!==undefined){bk[d.p].qty++;basket()}else if(d.r!==undefined){bk.splice(d.r,1);basket()}
 else if(d.py){pay=d.py;basket()}
 else if(d.ch!==undefined){if(bk.some(b=>!(b.price>=0)))return;const st=stock(),over=bk.filter(b=>b.qty>st[b.id]);if(over.length&&!confirm('Not enough stock for: '+over.map(o=>o.name).join(', ')+'. Record anyway?'))return;
  const n=Date.now();bk.forEach((b,i)=>S.sales.push({id:uid(),t:n+i,d:today(),item:b.id,name:b.name,qty:b.qty,price:b.price,pay}));bk=[];changed()}
 else if(d.v){const s=S.sales.find(x=>x.id===d.v);if(s&&confirm('Remove this sale? Stock is returned.')){s.v=1;changed()}}
 else if(d.dd){const x=new Date(day+'T12:00:00');x.setDate(x.getDate()+ +d.dd);day=ymd(x);render()}
 else if(d.csv!==undefined){const l=S.sales.filter(s=>s.d===day&&!s.v),c='time,item,qty,price,total,payment\n'+l.map(s=>[hm(s.t),'"'+s.name.replace(/"/g,'""')+'"',s.qty,s.price,s.qty*s.price,s.pay].join(',')).join('\n');dl(c,'sales-'+day+'.csv','text/csv')}
 else if(d.save!==undefined){const n=$('#an').value.trim(),p=$('#ap').value,qn=+$('#aq').value||0;if(!n||p===''||+p<0)return alert('Enter a name and a price.');
  const i=S.items.find(x=>!x.x&&x.name.toLowerCase()===n.toLowerCase()),now=Date.now();
  if(i){const cur=stock()[i.id];i.price=+p;i.base=cur+qn;i.bt=now;i.u=now}else S.items.push({id:uid(),name:n,price:+p,base:qn,bt:now,u:now});changed()}
 else if(d.ed){const i=S.items.find(x=>x.id===d.ed);$('#an').value=i.name;$('#ap').value=i.price;$('#aq').value='';$('#an').focus()}
 else if(d.rm){const i=S.items.find(x=>x.id===d.rm);if(confirm('Remove '+i.name+'? Past sales are kept.')){i.x=1;i.u=Date.now();changed()}}
 else if(d.k)calc(d.k);
 else if(d.tk!==undefined){S.tok=$('#tk').value.trim();persist();sync()}
 else if(d.ex!==undefined)dl(JSON.stringify({items:S.items,sales:S.sales,floats:S.floats}),'duka-backup-'+today()+'.json','application/json')});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.pr!==undefined){bk[t.dataset.pr].price=+t.value;bt()}else if(t.id==='td')bt()});
function dl(c,n,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
/* SYNC */
function mergeIn(d){const im=new Map(S.items.map(i=>[i.id,i]));(d.items||[]).forEach(i=>{const o=im.get(i.id);if(!o||(i.u||0)>(o.u||0))im.set(i.id,i)});S.items=[...im.values()];
 const sm=new Map(S.sales.map(s=>[s.id,s]));(d.sales||[]).forEach(s=>{const o=sm.get(s.id);if(!o)sm.set(s.id,s);else if(s.v)o.v=1});S.sales=[...sm.values()];
 Object.entries(d.floats||{}).forEach(([k,f])=>{if(!S.floats[k]||(f.u||0)>(S.floats[k].u||0))S.floats[k]=f})}
function build(){const o={'core.json':JSON.stringify({items:[...S.items].sort((a,b)=>a.id<b.id?-1:1),floats:S.floats})},m={};
 [...S.sales].sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1)).forEach(s=>(m[s.d.slice(0,7)]=m[s.d.slice(0,7)]||[]).push(s));for(const k in m)o['s-'+k+'.json']=JSON.stringify({sales:m[k]});return o}
async function gh(p,o={}){const r=await fetch('https://api.github.com'+p,{...o,headers:{Authorization:'Bearer '+S.tok,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw new Error(r.status===401?'bad token':r.status);return r.json()}
async function sync(){if(busy||!S.tok||!navigator.onLine){stat();return}busy=true;msg='';stat();
 try{if(!S.gid){const l=await gh('/gists?per_page=100');const f=l.find(g=>g.description==='DUKA-LEDGER');if(f)S.gid=f.id}
  const rf={};if(S.gid){const g=await gh('/gists/'+S.gid);for(const[n,f]of Object.entries(g.files)){let c=f.content;if(f.truncated)c=await(await fetch(f.raw_url)).text();rf[n]=c;try{mergeIn(JSON.parse(c))}catch(x){}}}
  const out=build(),ch={};for(const n in out)if(out[n]!==rf[n])ch[n]={content:out[n]};
  if(!S.gid){S.gid=(await gh('/gists',{method:'POST',body:JSON.stringify({description:'DUKA-LEDGER',public:false,files:ch})})).id}
  else if(Object.keys(ch).length)await gh('/gists/'+S.gid,{method:'PATCH',body:JSON.stringify({files:ch})});
  S.at=Date.now();persist()}catch(e){msg='Sync failed: '+e.message}
 busy=false;const a=document.activeElement;if(!a||a.tagName!=='INPUT')render();else stat()}
addEventListener('online',sync);addEventListener('offline',stat);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();sync();
</script></body></html>
